[package]
name = "c2pa-zip"
version = "0.1.0"
edition = "2021"
description = "C2PA Manifest Store embedding and reading for ZIP-based (OCF-style) documents: EPUB, DOCX, ODT, OXPS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/writerslogic/c2pa-zip"
keywords = ["c2pa", "provenance", "zip", "epub", "ocf"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Python bindings, built with maturin/PyO3 for the PyPI distribution. Native
# builds without it stay dependency-free.
python = ["dep:pyo3"]

[dependencies]

# The PyPI distribution enables the `python` feature; every other build stays
# dependency-free.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py39"] }
